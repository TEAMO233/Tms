<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="TMS 网络转发管理面板" />
    <meta property="og:title" content="TMS" />
    <meta property="og:description" content="TMS 网络转发管理面板" />
    <link href="/favicon.ico" rel="icon" />
    <title>TMS</title>
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("tms_theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      html {
        background: #fafafa;
        color-scheme: light;
      }

      html.dark {
        background: #09090b;
        color-scheme: dark;
      }

      body {
        background: inherit;
        color: #18181b;
      }

      html.dark body {
        color: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
